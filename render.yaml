# Render Blueprint: Postgres + API + web app on the free plan (Singapore is the closest region to India).
# Public URLs follow the service names. If Render adds a suffix because a name is taken,
# update NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SITE_URL / FRONTEND_URL to the real URLs and redeploy.
databases:
  - name: agriguard-db
    plan: free
    region: singapore
    databaseName: agriguard
    user: agriguard

services:
  - type: web
    name: mavestorm-agriguard-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # Applies any pending migrations (a no-op when up to date), then starts the API.
    startCommand: npx prisma db migrate --to production --db "$DATABASE_URL" && node dist/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: agriguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: FRONTEND_URL
        value: https://mavestorm-agriguard.onrender.com

  - type: web
    name: mavestorm-agriguard
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_API_URL
        value: https://mavestorm-agriguard-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mavestorm-agriguard.onrender.com

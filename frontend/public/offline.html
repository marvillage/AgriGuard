<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgriGuard · Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0a1433; color: #fff; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: rgba(255,255,255,0.7); max-width: 320px; line-height: 1.5; margin: 0 auto; }
      button { margin-top: 24px; background: #ffc72c; color: #0b0c0f; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-mark-on-dark.png" alt="AgriGuard" />
      <h1>You're offline</h1>
      <p>AgriGuard will show your last saved field data once a page has been opened online. Field nodes keep irrigating safely on their own.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
